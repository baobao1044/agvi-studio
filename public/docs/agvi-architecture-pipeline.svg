<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" fill="none">
  <rect width="1200" height="360" rx="16" fill="#09090B" stroke="#27272A" stroke-width="2" />

  <!-- Header -->
  <text x="40" y="42" fill="#10B981" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="800" letter-spacing="1.5">SYSTEM ARCHITECTURE • END-TO-END AGENTIC VIDEO PIPELINE</text>
  <text x="40" y="68" fill="#FAFAFA" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="800">How AI Agents Build Broadcast-Grade Videos with AGVI Studio</text>

  <!-- Step 1: AI Agent / Prompt -->
  <rect x="36" y="100" width="248" height="220" rx="12" fill="#121216" stroke="#27272A" stroke-width="1.5" />
  <rect x="52" y="118" width="68" height="22" rx="4" fill="#10B981" fill-opacity="0.15" />
  <text x="62" y="133" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="800">STEP 01</text>
  <text x="52" y="164" fill="#FAFAFA" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="800">AI Agent or Prompt</text>
  <text x="52" y="186" fill="#A1A1AA" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">Claude, GPT, Gemini, MCP,</text>
  <text x="52" y="204" fill="#A1A1AA" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">or Natural Language Script.</text>
  <rect x="52" y="224" width="216" height="76" rx="6" fill="#09090B" stroke="#27272A" stroke-width="1" />
  <text x="64" y="244" fill="#10B981" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10">POST /api/agent/actions</text>
  <text x="64" y="264" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10">- generate_from_prompt</text>
  <text x="64" y="282" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10">- enhance_video_with_motion</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="284" y1="210" x2="318" y2="210" stroke="#10B981" stroke-width="2" />
  <polygon points="314,205 324,210 314,215" fill="#10B981" />

  <!-- Step 2: Anti-Slop Compiler & Schema -->
  <rect x="326" y="100" width="256" height="220" rx="12" fill="#121216" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.5" />
  <rect x="342" y="118" width="68" height="22" rx="4" fill="#10B981" fill-opacity="0.15" />
  <text x="352" y="133" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="800">STEP 02</text>
  <text x="342" y="164" fill="#FAFAFA" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="800">Anti-Slop Sanitizer</text>
  <text x="342" y="186" fill="#A1A1AA" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">Enforces editorial typography,</text>
  <text x="342" y="204" fill="#A1A1AA" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">color tokens &amp; layout zoning.</text>
  <rect x="342" y="224" width="224" height="76" rx="6" fill="#09090B" stroke="#27272A" stroke-width="1" />
  <text x="354" y="244" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10">✓ Strips AI cliches &amp; neon</text>
  <text x="354" y="264" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10">✓ Max 2 widgets per scene</text>
  <text x="354" y="282" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10">✓ Zero-collision coordinates</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="582" y1="210" x2="616" y2="210" stroke="#10B981" stroke-width="2" />
  <polygon points="612,205 622,210 612,215" fill="#10B981" />

