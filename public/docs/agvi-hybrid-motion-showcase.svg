<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" fill="none">
  <rect width="1200" height="420" rx="16" fill="#09090B" stroke="#27272A" stroke-width="2" />

  <text x="40" y="42" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="800" letter-spacing="1.5">HYBRID VIDEO + MOTION GRAPHICS COMPOSITING</text>
  <text x="40" y="68" fill="#FAFAFA" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="800">4-Layer Motion Rig Applied to Every Video Clip Automatically</text>

  <!-- Layer 1 Card -->
  <rect x="36" y="96" width="266" height="292" rx="12" fill="#121216" stroke="#27272A" stroke-width="1.5" />
  <rect x="54" y="116" width="86" height="22" rx="4" fill="#10B981" fill-opacity="0.15" />
  <text x="64" y="131" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="800">LAYER 01</text>
  <text x="54" y="162" fill="#FAFAFA" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="800">Camera Motion Rig</text>
  <text x="54" y="184" fill="#A1A1AA" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">Transforms static B-roll or images</text>
  <text x="54" y="202" fill="#A1A1AA" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">into dynamic cinematic shots.</text>

  <rect x="54" y="222" width="230" height="146" rx="8" fill="#09090B" stroke="#27272A" stroke-width="1" />
  <text x="68" y="246" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700">• ken-burns-in (1.0x → 1.14x)</text>
  <text x="68" y="270" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">• ken-burns-out (1.15x → 1.0x)</text>
  <text x="68" y="294" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">• pan-left-right / right-left</text>
  <text x="68" y="318" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">• cinematic-drift (3D tilt)</text>
  <text x="68" y="342" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">• handheld-float (organic)</text>

  <!-- Layer 2 Card -->
  <rect x="322" y="96" width="266" height="292" rx="12" fill="#121216" stroke="#27272A" stroke-width="1.5" />
  <rect x="340" y="116" width="86" height="22" rx="4" fill="#F59E0B" fill-opacity="0.15" />
  <text x="350" y="131" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="800">LAYER 02</text>
  <text x="340" y="162" fill="#FAFAFA" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="800">Scene Transitions</text>
  <text x="340" y="184" fill="#A1A1AA" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">Spring-driven cuts &amp; mask reveals</text>
  <text x="340" y="202" fill="#A1A1AA" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">between consecutive timeline clips.</text>

  <rect x="340" y="222" width="230" height="146" rx="8" fill="#09090B" stroke="#27272A" stroke-width="1" />
  <text x="354" y="246" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700">• whip-pan (velocity blur)</text>
  <text x="354" y="270" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">• iris-reveal (circular mask)</text>
  <text x="354" y="294" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">• glitch-cut (RGB slice)</text>
  <text x="354" y="318" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">• flash-cut (exposure burst)</text>
  <text x="354" y="342" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">• slide-up / fade</text>

  <!-- Layer 3 Card -->
  <rect x="608" y="96" width="266" height="292" rx="12" fill="#121216" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.5" />
  <rect x="626" y="116" width="86" height="22" rx="4" fill="#10B981" fill-opacity="0.15" />
  <text x="636" y="131" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="800">LAYER 03</text>
  <text x="626" y="162" fill="#FAFAFA" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="800">Attached Overlays</text>
  <text x="626" y="184" fill="#A1A1AA" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">Motion graphics bound directly</text>
  <text x="626" y="202" fill="#A1A1AA" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">to a video clip without extra tracks.</text>

  <rect x="626" y="222" width="230" height="146" rx="8" fill="#09090B" stroke="#27272A" stroke-width="1" />
  <text x="640" y="246" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700">• spotlight-pointer (reticle)</text>
  <text x="640" y="270" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">• hud-telemetry (corner rig)</text>
  <text x="640" y="294" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">• lower-third-ribbon</text>
  <text x="640" y="318" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">• floating-kpi (stat badge)</text>
  <text x="640" y="342" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">• data-ticker / corner-frame</text>

  <!-- Layer 4 Card -->
  <rect x="894" y="96" width="270" height="292" rx="12" fill="#121216" stroke="#27272A" stroke-width="1.5" />
  <rect x="912" y="116" width="86" height="22" rx="4" fill="#818CF8" fill-opacity="0.15" />
  <text x="922" y="131" fill="#A5B4FC" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="800">LAYER 04</text>
  <text x="912" y="162" fill="#FAFAFA" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="800">Motion UI Widgets</text>
  <text x="912" y="184" fill="#A1A1AA" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">Standalone data &amp; code components</text>
  <text x="912" y="202" fill="#A1A1AA" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">with auto-zoned layout avoidance.</text>

  <rect x="912" y="222" width="234" height="146" rx="8" fill="#09090B" stroke="#27272A" stroke-width="1" />
  <text x="926" y="246" fill="#A5B4FC" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700">• stat-counter + sparkline</text>
  <text x="926" y="270" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">• bar-chart (animated race)</text>
  <text x="926" y="294" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">• code-terminal (typewriter)</text>
  <text x="926" y="318" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">• ai-chat (prompt-response)</text>
  <text x="926" y="342" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">• feature-grid (bento cards)</text>
</svg>
